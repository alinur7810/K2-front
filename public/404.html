<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var segments = location.pathname.split('/').filter(Boolean);
        var base = segments.length ? '/' + segments[0] + '/' : '/';
        sessionStorage.setItem('gh-pages-redirect', location.href);
        location.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
